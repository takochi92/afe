<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">こどもNISAの事前申込と制度開始の時系列</title><desc id="d">2026年10月は一部証券会社で事前申込開始、2027年1月に制度開始予定。対象0～17歳、年間枠60万円、非課税保有限度額600万円。</desc><rect width="800" height="520" rx="28" fill="#fff7d6"/><text x="42" y="64" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="30" font-weight="800" fill="#202019">事前申込と制度開始は別</text><line x1="102" y1="145" x2="700" y2="145" stroke="#202019" stroke-width="8"/><circle cx="190" cy="145" r="24" fill="#e85043"/><circle cx="600" cy="145" r="24" fill="#268a75"/><rect x="52" y="190" width="292" height="142" rx="20" fill="#fff" stroke="#202019" stroke-width="3"/><text x="74" y="234" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="25" font-weight="800" fill="#e85043">2026年10月</text><text x="74" y="280" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="25" font-weight="700" fill="#202019">一部で事前申込</text><rect x="456" y="190" width="292" height="142" rx="20" fill="#fff" stroke="#202019" stroke-width="3"/><text x="478" y="234" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="25" font-weight="800" fill="#268a75">2027年1月</text><text x="478" y="280" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="25" font-weight="700" fill="#202019">制度開始予定</text><rect x="50" y="370" width="700" height="100" rx="20" fill="#202019"/><text x="75" y="416" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="25" font-weight="700" fill="#fff">対象 0～17歳　年間 60万円　総枠 600万円</text><text x="75" y="450" font-family="Noto Sans JP,Yu Gothic,sans-serif" font-size="17" fill="#fff">2026年10月時点／投資には元本割れのリスクがあります</text></svg>