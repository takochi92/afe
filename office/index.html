<title>AFE本社ワークスペース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 左にナビ、右に明るいダッシュボード（成果の数字→社員の稼働→タスク／お知らせ／指示→プロジェクト）。ミント基調。ライト／ダーク両対応 */
:root{
  --bg:#f2f7f6;          /* ページの地（ミントがかった白） */
  --panel:#ffffff;       /* カード */
  --panel-2:#f6faf9;     /* カード内の段差・入力欄 */
  --side:#f9fcfb;        /* ナビ */
  --ink:#16302b;         /* 文字（緑みの濃紺） */
  --ink-soft:#5d7570;    /* 補助文字 */
  --line:#e0ebe8;        /* 罫線 */
  --accent:#17a77a;      /* ミントグリーン */
  --accent-soft:#dff4ec;
  --accent-ink:#ffffff;
  --ok:#17a77a; --warn:#d98a1c; --bad:#d4493a; --idle:#97aaa6;
  --c-ceo:#e0674a; --c-researcher:#3b82d6; --c-planner:#e39a22; --c-writer:#8a5bd6; --c-inspector:#d8483e; --c-recorder:#14a39a; --c-sales:#4a5fd0;
  --shadow:0 1px 2px rgba(22,48,43,.05),0 6px 18px rgba(22,48,43,.06);
  --font-head:"M PLUS Rounded 1c","Noto Sans JP",system-ui,sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a18; --panel:#152622; --panel-2:#1a2e2a; --side:#112220; --ink:#e4f2ee; --ink-soft:#8fa9a3; --line:#25403a;
  --accent:#2fc796; --accent-soft:#17382f; --accent-ink:#06231b; --ok:#2fc796; --warn:#eaa23c; --bad:#ee6b5c; --idle:#6c8680;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1a18; --panel:#152622; --panel-2:#1a2e2a; --side:#112220; --ink:#e4f2ee; --ink-soft:#8fa9a3; --line:#25403a;
  --accent:#2fc796; --accent-soft:#17382f; --accent-ink:#06231b; --ok:#2fc796; --warn:#eaa23c; --bad:#ee6b5c; --idle:#6c8680;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:16px 28px}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1400px;margin-inline:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

/* side */
.side{background:var(--side);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:16px}
@media (max-width:900px){.side{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px}}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:20px;flex:none}
.brand b{font-family:var(--font-head);font-size:.95rem;letter-spacing:.04em;display:block;line-height:1.2}
.brand span{font-size:.7rem;color:var(--ink-soft);display:block;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:4px}
@media (max-width:900px){.nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%}.brand span{display:none}}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;color:var(--ink-soft);font-weight:500}
.nav button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.ceo-box{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;font-size:.78rem;color:var(--ink-soft)}
@media (max-width:900px){.ceo-box{display:none}}
.ceo-box .row{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none;display:inline-block}
.dot.working{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.waiting{background:var(--warn)} .dot.failed{background:var(--bad)}

/* main */
.main{display:grid;gap:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start}
.head h1{font-size:clamp(1.3rem,2.6vw,1.75rem);font-weight:800}
.head p{margin:2px 0 0;color:var(--ink-soft)}
.clock{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:.9rem}
.clock .bell{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink)}
.clock .bell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.ico{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-size:.8rem;font-weight:500;padding:0}
.sub{font-size:.8rem;color:var(--ink-soft)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center}
.kpi .ico{grid-row:span 3;width:48px;height:48px;border-radius:14px}
.kpi .ico svg{width:24px;height:24px}
.kpi .lb{font-size:.8rem;color:var(--ink-soft)}
.kpi .val{font-family:var(--font-head);font-size:1.7rem;font-weight:800;line-height:1.2;white-space:nowrap}
.kpi .val small{font-size:.9rem;font-weight:700;margin-left:2px}
.kpi .nt{font-size:.75rem;color:var(--ink-soft)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* staff */
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sc{border:1px solid var(--line);border-radius:16px;background:var(--panel-2);padding:12px;display:grid;gap:8px;text-align:left;cursor:pointer;min-width:0;position:relative}
.sc.sel{outline:2px solid var(--accent);outline-offset:1px}
.sc-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--panel));border:2px solid color-mix(in srgb,var(--c) 55%,var(--panel));flex:none;overflow:hidden}
.av canvas{width:30px;height:auto;image-rendering:pixelated}
.sc .nm{font-weight:700;line-height:1.3}
.sc .rl{font-size:.74rem;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--st,var(--idle)) 16%,var(--panel));color:var(--st,var(--idle));width:max-content}
.pill.working{--st:var(--ok)} .pill.waiting{--st:var(--warn)} .pill.failed{--st:var(--bad)}
.sc .tk{font-size:.78rem;color:var(--ink-soft);min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc .pr{font-size:.72rem;color:var(--ink-soft);display:flex;justify-content:space-between}
.sc .bar i{background:var(--c)}

/* 3 columns */
.trio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:1180px){.trio{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.trio .ord{grid-column:1/-1}}
@media (max-width:700px){.trio{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:2px 12px;font-size:.78rem;cursor:pointer;color:var(--ink-soft)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.list{display:grid;gap:2px;max-height:330px;overflow:auto;min-width:0}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.86rem}
.li:last-child{border-bottom:0}
.li .t{color:var(--ink-soft);font-size:.74rem;white-space:nowrap}
.li .x{min-width:0;overflow-wrap:anywhere}
.li .x small{display:block;color:var(--ink-soft);font-size:.72rem}
.li .late{color:var(--bad);font-weight:700}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--c,var(--idle));display:grid;place-items:center;flex:none}
.chk.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk.done::after{content:"";width:4px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.doing{--c:var(--c-researcher)} .chk.wait{--c:var(--warn)} .chk.todo{--c:var(--idle)}
.nico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--panel));flex:none}
.empty{color:var(--ink-soft);font-size:.86rem;border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--panel-2)}
.empty b{color:var(--ink)}
.empty button{margin-top:8px}

/* composer */
.composer{display:grid;gap:8px}
.composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer label{font-size:.8rem;color:var(--ink-soft)}
.composer select{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:5px 10px;min-width:0;max-width:100%}
.composer textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;line-height:1.55}
.composer .hint{font-size:.74rem;color:var(--ink-soft);flex:1;min-width:12em}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 18px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.toast{font-size:.8rem;min-height:1.2em}
.toast.err{color:var(--bad)} .toast.ok{color:var(--ok)}
.orders{display:grid;gap:4px;max-height:130px;overflow:auto}
.order{display:flex;gap:8px;font-size:.78rem;align-items:baseline;min-width:0}
.order .st{flex:none;padding:0 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);font-size:.7rem}
.order .st.sent{background:var(--accent-soft);color:var(--accent)} .order .st.queued{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.order .st.failed,.order .st.unknown{background:color-mix(in srgb,var(--bad) 15%,var(--panel));color:var(--bad)}
.order .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* projects */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pj{border:1px solid var(--line);border-radius:16px;background:var(--panel-2);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center}
.pj .ico{grid-row:span 2;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--c)}
.pj b{line-height:1.3;overflow-wrap:anywhere}
.pj .d{font-size:.76rem;color:var(--ink-soft);overflow-wrap:anywhere}
.pj .pill{grid-column:2;margin-top:4px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.col h3{font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:8px}
.col h3 .n{color:var(--ink-soft)}
.col.doing h3{color:var(--c-researcher)} .col.wait h3{color:var(--warn)} .col.done h3{color:var(--accent)}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:.84rem;line-height:1.5;overflow-wrap:anywhere}
.tcard .meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:.72rem;color:var(--ink-soft)}
.tcard .late{color:var(--bad);font-weight:700}
.tcard .own{display:block;font-size:.72rem;color:var(--ink-soft)}

/* log */
.log{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:8px 12px;min-width:0}
.msg .who{font-size:.74rem;color:var(--ink-soft);display:flex;gap:8px;justify-content:space-between}
.msg.owner{background:var(--accent-soft);margin-left:10%}
.msg.ceo{margin-right:6%}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem;line-height:1.6}
.msg .body.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.msg .more{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:.8rem;text-decoration:underline}
.tool{font-size:.74rem;color:var(--ink-soft);padding-left:10px;border-left:3px solid var(--line)}
.scroll{max-height:62vh;overflow:auto}
.act{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:2px 10px;font-size:.84rem;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
.act time{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.act .who{font-weight:700}
.sec{font-weight:700;margin:6px 0}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.person .tk{grid-column:2;font-size:.82rem}
.person code{font-size:.75rem;background:var(--panel-2);padding:0 6px;border-radius:6px}
[hidden]{display:none!important}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">A</div><div><b>AFE WORKSPACE</b><span>AIとつくる、自由な働き方。</span></div></div>
    <nav class="nav" id="nav" aria-label="メニュー">
      <button type="button" data-view="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
      <button type="button" data-view="roster"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg>社員名簿</button>
      <button type="button" data-view="tasks"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>進行ボード</button>
      <button type="button" data-view="log"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>指示ログ</button>
      <button type="button" data-view="work"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/></svg>作業ログ</button>
    </nav>
    <div class="ceo-box">
      <div class="row"><span class="dot" id="ceoDot"></span><span id="ceoText">社長の状態を確認中</span></div>
      <div id="lastAct">最後の動き：―</div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div>
        <h1>オーナー、おかえりなさい！</h1>
        <p>AI社員たちが、事業を裏から動かしています。</p>
      </div>
      <div class="clock"><span class="num" id="clock">―</span><button type="button" class="bell" id="bell" aria-label="お知らせを見る"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/></svg></button></div>
    </header>

    <!-- ホーム -->
    <section id="view-home" class="main">
      <div class="kpis" id="kpis"></div>

      <div class="card">
        <div class="card-h"><h2><span class="ico"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg></span>AI社員の稼働状況</h2><span class="sub">宛先に選ぶには、社員を押します</span></div>
        <div class="staff" id="staff"></div>
      </div>

      <div class="trio">
        <div class="card">
          <div class="card-h"><h2><span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></span>本日のタスク</h2><button class="link" type="button" data-go="tasks">すべて見る →</button></div>
          <div class="chips" id="taskChips">
            <button type="button" data-f="all" aria-pressed="true">すべて</button>
            <button type="button" data-f="doing" aria-pressed="false">進行中</button>
            <button type="button" data-f="done" aria-pressed="false">完了</button>
          </div>
          <div class="list" id="todayTasks"></div>
        </div>
        <div class="card">
          <div class="card-h"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/></svg></span>最新のお知らせ</h2><button class="link" type="button" data-go="work">すべて見る →</button></div>
          <div class="list" id="notices"></div>
        </div>
        <div class="card ord">
          <div class="card-h"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></span>社長へ指示を送る</h2><button class="link" type="button" data-go="log">指示ログ →</button></div>
          <form class="composer" id="composer" autocomplete="off">
            <div class="row">
              <label for="to">宛先</label>
              <select id="to"></select>
              <span class="hint">社員を直接は動かせません。社長（Claude）が受け取って担当に割り振ります。</span>
            </div>
            <textarea id="order" placeholder="例：こどもNISAの柱記事①の企画を企画部に作らせて"></textarea>
            <div class="row">
              <span class="toast" id="toast"></span>
              <span style="flex:1"></span>
              <button type="submit" class="btn primary" id="send">指示を送る</button>
            </div>
            <div class="orders" id="orders"></div>
          </form>
        </div>
      </div>

      <div class="card">

(() => {

/* ---------- 本日のタスク・お知らせ ---------- */
let taskFilter = "all";
for (const b of document.querySelectorAll("#taskChips button")) b.addEventListener("click", () => {

function renderToday(){
  const el = $("todayTasks");
  if (!tasks) { el.innerHTML = '<div class="empty">読み込んでいます…</div>'; return; }

  let list = tasks.filter(t => t.col !== "done" || (t.doneAt && dayKey(t.doneAt) === todayK));

function renderBoard(){

/* ---------- 指示ログ（オーナーと社長の会話） ---------- */
const logEl = $("log"), workEl = $("work");
let logState = {kind:"loading"};
function stripText(s){ return s.replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g, "").replace(/<\/?(command-[a-z-]+|local-command-[a-z-]+)>/g, "").trim(); }
function parseEvents(payload){
  const data = payload?.ccr?.data || payload?.data || [];
  const out = [];
  for (const ev of data) {
    const kind = ev.user ? "user" : ev.assistant ? "assistant" : null;
    if (!kind) continue;
    const c = ev[kind]?.internal_anthropic_catchall;
    if (!c || c.isSynthetic) continue;
    const content = c.message?.content;
    const texts = [], tools = [];
    if (typeof content === "string") texts.push(content);
    else if (Array.isArray(content)) for (const b of content) {
      if (b?.type === "text" && b.text) texts.push(b.text);
      else if (b?.type === "tool_use") tools.push(b.name === "Agent" && b.input?.subagent_type ? `社員を呼び出し：${b.input.subagent_type}（${b.input.description || ""}）` : `作業：${b.name}${b.input?.description ? "（" + b.input.description + "）" : ""}`);
    }
    const text = stripText(texts.join("\n"));
    if (!text && !tools.length) continue;
    out.push({kind, text, tools, at: ev.created_at});
  }
  return out;
}
function msgNode(kind, text, at, clamp){
  const m = document.createElement("div"); m.className = "msg " + (kind === "user" ? "owner" : "ceo");
  const who = document.createElement("div"); who.className = "who"; who.innerHTML = "<span></span><span></span>";
  who.firstChild.textContent = kind === "user" ? "オーナー" : "社長（Claude）"; who.lastChild.textContent = at ? fmtTime(at) : "";
  const body = document.createElement("div"); body.className = "body"; body.textContent = text;
  m.append(who, body);
  if (clamp && (text.length > 360 || text.split("\n").length > 8)) {
    body.classList.add("clamp");
    const more = document.createElement("button"); more.type = "button"; more.className = "more"; more.textContent = "全文を表示";
    more.addEventListener("click", () => { const on = body.classList.toggle("clamp"); more.textContent = on ? "全文を表示" : "たたむ"; });
    m.append(more);
  }
  return m;
}
function renderWork(){
  const s = logState;
  if (s.kind === "items") {
    const p = $("pane-work");
    const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 60;

    for (const it of s.items) {
      if (it.text) { tl = null; nodes.push(msgNode(it.kind, it.text, it.at, true)); }
      for (const tname of it.tools) {
        if (!tl) { tl = document.createElement("div"); tl.className = "tool"; nodes.push(tl); }
        if (tl.childNodes.length < 6) { const d = document.createElement("div"); d.textContent = tname; tl.append(d); }
      }
    }
    if (!nodes.length) nodes.push(Object.assign(document.createElement("div"), {className:"empty", textContent:"まだ会話がありません。"}));
    workEl.replaceChildren(...nodes);
    if (atBottom || !s.scrolled) { p.scrollTop = p.scrollHeight; s.scrolled = true; }
    return;
  }
  const box = document.createElement("div"); box.className = "empty";
  const msgs = {
    loading: ["社長との会話を読み込んでいます。", "初回は Claude Code Remote コネクタの利用許可を求められます。"],
    nomcp: ["この表示では会話ログを読み込めません。", "Claude のアプリか claude.ai でこのページを開くと表示されます。指示は送れます（社長が次に動いたときに読みます）。"],
    needs_reauth: ["Claude Code Remote の接続が切れています。", "claude.ai の 設定 → コネクタ で再接続してください。"],
    server_not_connected: ["Claude Code Remote コネクタが見つかりません。", "claude.ai の 設定 → コネクタ で追加してください。"],
    not_in_manifest: ["このページでの Claude Code Remote の利用が許可されていません。", "ページ右上の権限メニューから許可できます。"],
    approval_required: ["会話ログの読み込みには許可が必要です。", ""],
    error: ["会話ログを読み込めませんでした。", s.message || ""],
  }[s.kind] || ["会話ログを読み込めませんでした。", ""];
  box.innerHTML = "<b></b><br><span></span>";
  box.querySelector("b").textContent = msgs[0]; box.querySelector("span").textContent = msgs[1];
  if (s.kind === "approval_required") {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "許可して読み込む";
    b.addEventListener("click", async () => { try { const r = await mcp.callTool(SERVER, "list_events", EVENTS_INPUT); logState = {kind:"items", items: parseEvents(r.payload)}; renderWork(); } catch (e) { logState = errState(e); renderWork(); } });
    box.append(document.createElement("br"), b);
  }
  workEl.replaceChildren(box);
}
function orderThread(){
  const out = [];
  for (const o of [...orders].reverse()) {
    out.push(msgNode("user", o.text, o.createdAt));
    if (o.reply) out.push(msgNode("ceo", o.reply, o.repliedAt));
    else if (o.state === "sent") out.push(msgNode("ceo", "届きました。社長が受け取りました。処理が終わると、ここに返事が出ます。", o.createdAt));
    else if (o.state === "sending") out.push(msgNode("ceo", "送信しています…", o.createdAt));
    else if (o.state === "queued" || o.state === "failed" || o.state === "unknown") out.push(msgNode("ceo", "まだ届いていません。" + (o.note ? "（" + o.note + "）" : ""), o.createdAt));
  }
  return out;
}
function renderLog(){
  const nodes = orderThread();
  const p = $("pane-log");
  const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 80;
  if (!nodes.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = "<b>まだ指示がありません。</b><br>ホームの欄から社長に指示を送ると、ここに「あなたの指示」と「社長の返事」が並びます。";
    nodes.push(e);
  }
  logEl.replaceChildren(...nodes);
  if (atBottom) p.scrollTop = p.scrollHeight;
}
function errState(e){
  const code = e?.code;
  if (["needs_reauth","server_not_connected","not_in_manifest","approval_required"].includes(code)) return {kind:code};
  if (code === "selection_required") return {kind:"error", message:"同名のコネクタが複数あります。表示された選択画面で1つ選んでください。"};
  if (code === "not_granted" || code === "capability_disabled" || code === "capability_removed") return {kind:"nomcp"};
  return {kind:"error", message: e?.message || String(code || "")};
}

/* ---------- 社長の状態（セッション） ---------- */
function renderCeo(){
  const dot = $("ceoDot"), txt = $("ceoText");
  if (!ceoBucket) { dot.className = "dot"; txt.textContent = "社長の状態：不明"; return; }
  dot.className = "dot " + ceoBucket.status; txt.textContent = "社長：" + ceoBucket.label;
}
function bucketOf(p){
  const ccr = p?.ccr || p || {};
  const b = String(ccr.status_bucket || "");
  if (/WORKING/.test(b)) return {status:"working", label:"作業中"};
  if (/BLOCKED/.test(b)) return {status:"waiting", label:"オーナーの返事待ち"};
  if (/FAILED/.test(b)) return {status:"failed", label:"エラーで停止"};
  if (/REVIEW_READY|COMPLETED|IDLE/.test(b)) return {status:"idle", label:"待機中（指示を受け付けます）"};
  return {status:"idle", label: ccr.session_status ? "待機中" : "不明"};
}

/* ---------- 指示の送信 ---------- */
const form = $("composer"), ta = $("order"), sendBtn = $("send"), toast = $("toast"), toEl = $("to");
for (const s of STAFF) { const o = document.createElement("option"); o.value = s.id; o.textContent = s.id === "ceo" ? "社長（Claude）" : `${s.dept}・${s.name}`; toEl.append(o); }
toEl.addEventListener("change", () => { selected = toEl.value; renderStaff(); });
try { const d = localStorage.getItem("afe-draft"); if (d) ta.value = d; } catch {}
ta.addEventListener("input", () => { try { localStorage.setItem("afe-draft", ta.value); } catch {} });
ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); } });
function say(text, kind=""){ toast.textContent = text; toast.className = "toast " + kind; }

const ORDER_LABEL = {sending:"送信中", sent:"届いた", queued:"保留", unknown:"不明", failed:"失敗", done:"対応済"};
function renderOrders(){
  const el = $("orders");
  el.replaceChildren(...orders.slice(0, 6).map(o => {
    const d = document.createElement("div"); d.className = "order";
    const st = document.createElement("span"); st.className = "st " + o.state; st.textContent = ORDER_LABEL[o.state] || o.state;
    const tx = document.createElement("span"); tx.className = "tx";
    const who = STAFF.find(s => s.id === o.to);
    tx.textContent = `${fmtTime(o.createdAt)} → ${who ? (who.id === "ceo" ? "社長" : who.dept) : ""}：${o.text}`;
    tx.title = o.note ? `${o.text}\n\n${o.note}` : o.text;
    d.append(st, tx); return d;
  }));
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = ta.value.trim();
  if (!text) { say("指示の内容を入力してください。", "err"); ta.focus(); return; }
  if (!db && !mcp && !comments) { say("この表示では指示を送れません。Claude のアプリか claude.ai でこのページを開いてください。", "err"); return; }
  sendBtn.disabled = true; say("送信しています…");
  const s = STAFF.find(x => x.id === toEl.value) || STAFF[0];
  const toLabel = s.id === "ceo" ? "社長" : `${s.dept}（${s.name}）`;
  const message = `【会社サイトからの指示】宛先：${toLabel}\n${text}`;
  let ref = null;
  if (db) { try { ref = await db.collection("orders").add({text, to:s.id, createdAt:new Date().toISOString(), state:"sending"}); } catch {} }
  let state = "queued", note = "";
  if (comments) {
    try {
      const can = await comments.canSendToClaude();
      if (can === "available") {
        const anchor = await comments.anchorFor(form);
        const r = await comments.sendToClaude({anchor, text: message.slice(0, 1300)});
        state = "sent"; note = "コメントとして社長に届けました（thread " + r.threadId + "）";
      } else {
        note = {writers_only:"このページの編集権限がないため、社長に直接は送れません。", no_session:"社長（Claudeのセッション）が今は受け取れない状態です。", off:"この表示ではClaudeへの送信が使えません。"}[can] || "";
      }
    } catch (err) {
      const code = err?.code;
      if (code === "consent_required") note = "コメントの許可が必要です。表示された確認で許可してから、もう一度送ってください。";
      else if (code === "forbidden") note = "このページからのコメントがオフになっています。コメント欄の設定から許可できます。";
      else if (code === "rate_limited") note = "送信が続いたため一時的に止まっています。少し待ってから送ってください。";
      else note = err?.message || String(code || "");
    }
  }
  if (state !== "sent" && mcp) {
    try { await mcp.callTool(SERVER, "send_message", {session_id: SESSION_ID, message}); state = "sent"; }
    catch (err) {
      const code = err?.code;
      if (code === "server_unavailable" || code === "upstream_error" || code === "cancelled") { state = "unknown"; note = "届いたか確認できませんでした。指示ログに出てこなければ、もう一度送ってください。"; }
      else if (code === "needs_reauth") note = "Claude Code Remote の接続が切れています。設定 → コネクタで再接続してください。";
      else if (code === "server_not_connected") note = "Claude Code Remote コネクタがありません。設定 → コネクタで追加してください。";
      else if (code === "not_in_manifest" || code === "approval_required") note = "このページからの送信が許可されていません。ページの権限メニューで許可してください。";
      else note = err?.message || String(code || "送信エラー");
    }
  } else if (state !== "sent" && !note) note = "この表示では社長に直接届けられないため、指示を保留しました。社長が次に動いたときに読みます。";
  if (ref) { try { await ref.update({state, note}); } catch {} }
  else if (state !== "sent") state = "failed";
  sendBtn.disabled = false;
  if (state === "sent") {
    say("社長に届きました。返事は指示ログに表示されます。", "ok");
    ta.value = ""; try { localStorage.removeItem("afe-draft"); } catch {}
    if (mcp) mcp.invalidate(SERVER, "list_events").catch(() => {});
  } else if (state === "queued") { say("保留しました：" + note, "err"); ta.value = ""; try { localStorage.removeItem("afe-draft"); } catch {} }
  else if (state === "unknown") say(note, "err");
  else say("送れませんでした：" + (note || "データ保存も使えない表示です。"), "err");
});

/* ---------- 起動 ---------- */
const EVENTS_INPUT = {session_id: SESSION_ID, kinds:["user","assistant"], limit:100};
function renderAll(){ renderStaff(); renderToday(); renderNotices(); renderProjects(); renderBoard(); renderLog(); renderOrders(); renderCeo(); renderWork(); }
renderAll();
{ const v = (location.hash || "").slice(1); if (["home","roster","tasks","log","work"].includes(v)) go(v); }

(async () => {
  if (!window.claude?.use) { logState = {kind:"nomcp"}; tasks = []; renderAll(); return; }
  claude.use("db").then(d => {
    db = d;
    if (!db) { tasks = []; renderAll(); return; }
    db.collection("staff").onSnapshot(snap => {
      for (const doc of snap.docs) if (live[doc.id]) { const v = doc.data() || {}; live[doc.id] = {status: v.status || "idle", task: v.task || "", line: v.line || "", at: v.updatedAt || ""}; }
      renderStaff();
    }, () => {});
    db.collection("tasks").onSnapshot(snap => { tasks = snap.docs.map(d => ({id:d.id, ...d.data()})); renderStaff(); renderToday(); renderBoard(); }, () => { tasks = []; renderStaff(); renderToday(); renderBoard(); });
    db.collection("activity").orderBy("at","desc").limit(40).onSnapshot(snap => { activity = snap.docs.map(d => d.data()); renderNotices(); renderKpis(); }, () => {});
    db.collection("orders").orderBy("createdAt","desc").limit(30).onSnapshot(snap => { orders = snap.docs.map(d => ({id:d.id, ...d.data()})); renderOrders(); renderLog(); }, () => {});
    db.collection("kpi").onSnapshot(snap => { const doc = snap.docs.find(x => x.id === "summary"); kpi = doc ? doc.data() : null; renderKpis(); renderProjects(); }, () => {});
  });
  claude.use("comments").then(c => { comments = c; });
  claude.use("mcp").then(m => {
    mcp = m;
    if (!mcp) { logState = {kind:"nomcp"}; renderWork(); return; }
    mcp.watchTool(SERVER, "list_events", EVENTS_INPUT, ev => {
      if (ev.type === "data") { const prev = logState; logState = {kind:"items", items: parseEvents(ev.result.payload), scrolled: prev.scrolled}; }
      else { const st = errState(ev.error); if (logState.kind !== "items" || st.kind !== "error") logState = st; }
      renderWork();
    }, {refetchInterval: 30000});
    mcp.watchTool(SERVER, "get_session", {session_id: SESSION_ID}, ev => {
      if (ev.type === "data") ceoBucket = bucketOf(ev.result.payload);
      else if (!["server_unavailable","upstream_error"].includes(ev.error?.code)) ceoBucket = null;
      renderCeo(); renderStaff();
    }, {refetchInterval: 30000});
  });
})();
})();
</script>
