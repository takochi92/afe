<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>マイ金庫</title></head>
<body>
<header><strong>🔐 マイ金庫</strong><span class="grow"></span>
  <button id="syncBtn" class="ic hide" title="再取得">⟳</button>
  <button id="lockBtn" class="ic hide" title="ロック">🔒</button>
  <button id="setBtn" class="ic" title="設定">⚙</button></header>
<div id="msg" role="status"></div>

<section id="setup" class="hide"><p>はじめに設定画面でサーバーURLと同期トークンを入力してください。</p><button id="setup2" class="p">設定を開く</button></section>

<section id="lockView" class="hide">
  <label>マスターパスワード</label>
  <input id="mp" type="password" autocomplete="off" autofocus>
  <button id="unlockBtn" class="p">開く</button>
  <p class="mu" id="pendHint"></p>
</section>

<section id="mainView" class="hide">
  <div id="pending"></div>
  <div class="mu" id="site"></div>
  <div id="matches"></div>
  <details id="allBox"><summary>すべての項目</summary>
    <input id="q" placeholder="検索" autocomplete="off"><div id="all"></div></details>
</section>
<script type="module" src="popup.js"></script>
</body></html>
